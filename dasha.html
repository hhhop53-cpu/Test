<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Даша — English Challenge</title><style>
:root{font-family:system-ui,-apple-system,Arial;color:#26334a}*{box-sizing:border-box}body{margin:0;padding:16px;background:linear-gradient(140deg,#fff0f6,#f0f4ff)}main{max-width:760px;margin:auto}.hero,.panel,.question{background:white;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 5px 24px #25345412}.hero{text-align:center}.hero h1{margin:8px 0;color:#6748bf}.muted{color:#6e7890;font-size:14px}.pills{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.pill{background:#f3ebff;border-radius:25px;padding:8px 12px;font-weight:650}.question{padding:16px}.question h3{margin:6px 0 14px;font-size:18px}.opt{display:block;padding:12px;border:1px solid #dddde9;border-radius:12px;margin:8px 0;cursor:pointer}.opt:has(input:checked){background:#f2ecff;border-color:#8465dc}input{accent-color:#7956d7}button{border:0;border-radius:12px;padding:13px 18px;background:#7956d7;color:white;font-weight:bold;font-size:16px;cursor:pointer}button:disabled{opacity:.55}#quiz,#result{display:none}.correct{background:#e8f8ec}.wrong{background:#fff0f0}.review{padding:12px;margin:10px 0;border-radius:10px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.score{font-size:30px;font-weight:800;color:#6748bf}</style></head><body><main>
<section class="hero"><div style="font-size:40px">🦋 🌸 🐱</div><h1>Даша — English Challenge</h1><div class="pills"><span class="pill" id="levelPill">Уровень — / 10</span><span class="pill" id="pointsPill">⭐ Баллы: —</span><span class="pill">10 заданий</span></div><p class="muted">Новый уровень откроется после 10 правильных ответов из 10. За успех — 60 баллов!</p></section>
<section class="panel" id="startPanel"><h2 id="startTitle">Загружаем задания…</h2><p class="muted" id="loadStatus">Подключаемся к серверу.</p><button id="startBtn" disabled>Начать тест ✨</button></section>
<section id="quiz"><div class="panel"><b id="timer">⏱ 00:00</b><p class="muted">Выбери один правильный ответ в каждом задании.</p></div><div id="questions"></div><button id="submitBtn">Проверить ответы</button></section>
<section class="panel" id="result"><h2>Результат 🌟</h2><div class="score" id="score"></div><p id="message"></p><p id="reward"></p><div id="review"></div><div class="actions"><button id="againBtn">Следующий уровень / повторить</button></div></section></main>
<script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbzjiijPpMKBoR4FAU4rny_niASspsCXHqIN4bygEcLHNDopmyyr_aH6QPZkLEPWpHTmDw/exec';
let current=null,started=0,timerId=null,submitting=false;
const $=id=>document.getElementById(id);
function api(action,payload){return new Promise((resolve,reject)=>{const cb='dashaCb'+Date.now()+Math.floor(Math.random()*1e6);const sc=document.createElement('script');const timeout=setTimeout(()=>finish(Error('Сервер не ответил.')),15000);function finish(err,value){clearTimeout(timeout);delete window[cb];sc.remove();err?reject(err):resolve(value);}window[cb]=data=>finish(null,data);sc.onerror=()=>finish(Error('Ошибка соединения с сервером.'));sc.src=ENDPOINT+'?action='+encodeURIComponent(action)+'&callback='+cb+(payload?'&payload='+encodeURIComponent(JSON.stringify(payload)):'');document.body.appendChild(sc);});}
async function load(){clearInterval(timerId);$('quiz').style.display='none';$('result').style.display='none';$('startPanel').style.display='block';$('startBtn').disabled=true;$('loadStatus').textContent='Загружаем задания…';try{const d=await api('getTest');if(!d.ok)throw Error(d.error);current=d;$('levelPill').textContent='Уровень '+d.level+' / '+d.totalLevels;$('pointsPill').textContent='⭐ Баллы: '+d.pointsBalance;$('startTitle').textContent=d.title;$('loadStatus').textContent='10 вопросов · 60 баллов за 10/10';$('startBtn').disabled=false;}catch(e){$('loadStatus').textContent='Ошибка: '+e.message;}}
$('startBtn').onclick=()=>{started=Date.now();$('startPanel').style.display='none';$('quiz').style.display='block';$('questions').innerHTML='';current.questions.forEach((q,i)=>{const div=document.createElement('section');div.className='question';const h=document.createElement('h3');h.textContent=(i+1)+'. '+q.prompt;div.appendChild(h);q.options.forEach((opt,j)=>{const label=document.createElement('label');label.className='opt';const input=document.createElement('input');input.type='radio';input.name=q.id;input.value=j;label.append(input,document.createTextNode(' '+opt));div.appendChild(label);});$('questions').appendChild(div);});timerId=setInterval(()=>{const n=Math.floor((Date.now()-started)/1000);$('timer').textContent='⏱ '+String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');},1000);};
$('submitBtn').onclick=async()=>{if(submitting)return;const answers=current.questions.map(q=>{const x=document.querySelector('input[name="'+q.id+'"]:checked');return x?{questionId:q.id,selectedIndex:Number(x.value)}:null;});if(answers.some(a=>!a)){alert('Ответь на все 10 вопросов.');return;}submitting=true;$('submitBtn').disabled=true;$('submitBtn').textContent='Проверяем на сервере…';const attemptId='dasha_'+Date.now()+'_'+Math.random().toString(36).slice(2,10);try{const d=await api('submit',{level:current.level,attemptId,answers,durationSeconds:Math.floor((Date.now()-started)/1000)});if(!d.ok)throw Error(d.error);clearInterval(timerId);$('quiz').style.display='none';$('result').style.display='block';$('score').textContent=d.score+' / 10';$('reward').textContent='🎁 Начислено: +'+d.pointsAwarded+' · ⭐ Баланс: '+d.pointsBalance;$('message').textContent=d.passed?'🏆 Отлично! Уровень пройден.':'Ты молодец! Исправь ошибки и попробуй ещё раз.';$('review').innerHTML='';d.results.forEach((r,i)=>{const div=document.createElement('div');div.className='review '+(r.correct?'correct':'wrong');const p=document.createElement('b');p.textContent=(i+1)+'. '+r.prompt;const desc=document.createElement('p');const q=current.questions.find(q=>q.id===r.questionId);desc.textContent='Твой ответ: '+q.options[r.selectedIndex]+' · Правильный: '+q.options[r.correctIndex]+'. '+r.explanation;div.append(p,desc);$('review').appendChild(div);});$('result').scrollIntoView({behavior:'smooth'});}catch(e){alert('Ошибка отправки: '+e.message+' Попробуй снова.');}finally{submitting=false;$('submitBtn').disabled=false;$('submitBtn').textContent='Проверить ответы';}};
$('againBtn').onclick=load;load();
</script></body></html>
