name: Artyom Apps Script - validate source and auth

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify expected project and deployment identifiers
        env:
          SCRIPT_ID: 1RM7ynJPf5CTAHGLjV9Ciud7wFswr8V7B77udf2O0grgwvk070fq9UtRH
          DEPLOYMENT_ID: AKfycby7h-mc--QERnZ_N62qBu2FbjmvOHRYYzFAMH0ziH3w1w3uVgPUM2_EVX2EEw4zzc7VPw
        run: |
          test -n "$SCRIPT_ID"
          test -n "$DEPLOYMENT_ID"
          echo "Target IDs configured; no deployment will occur."
      - name: Check JavaScript syntax
        run: node --check apps-script/artyom/Code.js
      - name: Check dashboard file
        run: |
          test -s apps-script/artyom/Dashboard.html
          grep -q 'google.script.run' apps-script/artyom/Dashboard.html
          echo "Source files validated."
      - name: Install clasp
        run: npm install --global @google/clasp
      - name: Verify clasp authentication (read-only)
        env:
          CLASP_CREDENTIALS_JSON: ${{ secrets.CLASP_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$CLASP_CREDENTIALS_JSON" ]; then
            echo "::error::Missing CLASP_CREDENTIALS_JSON repository secret"
            exit 1
          fi
          printf '%s' "$CLASP_CREDENTIALS_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          trap 'rm -f "$HOME/.clasprc.json"' EXIT
          clasp list > /dev/null
          echo "Clasp authentication succeeded. No files were pushed or deployed."

      - name: Verify existing Apps Script deployment (read-only)
        env:
          CLASP_CREDENTIALS_JSON: ${{ secrets.CLASP_CREDENTIALS_JSON }}
          SCRIPT_ID: 1RM7ynJPf5CTAHGLjV9Ciud7wFswr8V7B77udf2O0grgwvk070fq9UtRH
          DEPLOYMENT_ID: AKfycby7h-mc--QERnZ_N62qBu2FbjmvOHRYYzFAMH0ziH3w1w3uVgPUM2_EVX2EEw4zzc7VPw
        run: |
          set -euo pipefail
          test -n "$CLASP_CREDENTIALS_JSON"
          printf '%s' "$CLASP_CREDENTIALS_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          trap 'rm -f "$HOME/.clasprc.json" .clasp.json deployments.txt' EXIT
          printf '{"scriptId":"%s"}\n' "$SCRIPT_ID" > .clasp.json
          clasp deployments > deployments.txt
          if grep -Fq "$DEPLOYMENT_ID" deployments.txt; then
            echo "Confirmed: existing deployment belongs to the configured Apps Script project."
            echo "Read-only verification complete. No push or deploy occurred."
          else
            echo "::error::Configured deployment was not found for this Apps Script project."
            exit 1
          fi
