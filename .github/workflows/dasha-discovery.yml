name: Dasha - identify live Google Apps Script

on:
  push:
    branches: [main]
    paths: ['release-requests/dasha-discovery.json']

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Install clasp
        run: npm install --global @google/clasp
      - name: Read-only find Dasha Apps Script
        env:
          CLASP_CREDENTIALS_JSON: ${{ secrets.CLASP_CREDENTIALS_JSON }}
          DASHA_DEPLOYMENT_ID: AKfycbzjiijPpMKBoR4FAU4rny_niASspsCXHqIN4bygEcLHNDopmyyr_aH6QPZkLEPWpHTmDw
        run: |
          set -euo pipefail
          test -n "$CLASP_CREDENTIALS_JSON"
          printf '%s' "$CLASP_CREDENTIALS_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          trap 'rm -f "$HOME/.clasprc.json"' EXIT
          clasp list-scripts > "$RUNNER_TEMP/scripts-list.txt"
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          lines=Path(os.environ['RUNNER_TEMP']+'/scripts-list.txt').read_text().splitlines()
          candidates=[line.strip() for line in lines if re.search(r'даша|dasha',line,re.IGNORECASE)]
          print('Recent script count:',len(lines))
          print('Dasha title matches:',len(candidates))
          for item in candidates:
              print('CANDIDATE:',item)
          PY
          python3 - <<'PY'
          import re, os, pathlib, subprocess, json
          lines=pathlib.Path(os.environ['RUNNER_TEMP']+'/scripts-list.txt').read_text().splitlines()
          cands=[line for line in lines if re.search(r'даша|dasha',line,re.IGNORECASE)]
          ids=[]
          for line in cands:
              ids.extend(re.findall(r'[A-Za-z0-9_-]{38,70}',line))
          for sid in dict.fromkeys(ids):
              stage=pathlib.Path(os.environ['RUNNER_TEMP'])/'probe'
              stage.mkdir(exist_ok=True)
              (stage/'.clasp.json').write_text(json.dumps({'scriptId':sid}))
              p=subprocess.run(['clasp','list-deployments'],cwd=stage,
                 capture_output=True,text=True,timeout=40)
              if p.returncode == 0 and os.environ['DASHA_DEPLOYMENT_ID'] in p.stdout:
                  print('CONFIRMED_DASHA_SCRIPT_ID:',sid)
                  break
          else:
              print('No confirmed matching deployment from title candidates.')
          PY
