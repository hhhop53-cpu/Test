name: Dasha English - publish 50 words block 31-40

on:
  push:
    branches: [main]
    paths:
      - 'release-requests/dasha-vocabulary-publish.json'

permissions:
  contents: read

concurrency:
  group: dasha-google-apps-script-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate approved source fingerprints and all 300 questions
        run: |
          set -euo pipefail
          python3 -m py_compile apps-script/dasha/extend-vocabulary-bank.py
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          req=json.loads(Path('release-requests/dasha-vocabulary-publish.json').read_text())
          assert req.get('action')=='publish_dasha_vocabulary_31_40'
          for field,path in (
            ('first_bank_sha','apps-script/dasha/beginner-bank.json'),
            ('second_bank_sha','apps-script/dasha/next-bank.json'),
            ('third_bank_sha','apps-script/dasha/review-bank.json'),
            ('vocabulary_sha','apps-script/dasha/vocabulary-31-40.json'),
            ('patcher_sha','apps-script/dasha/extend-vocabulary-bank.py')):
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert req.get(field)==actual,(field,'unapproved source changed')
          data=[json.loads(Path(s).read_text()) for s in (
            'apps-script/dasha/beginner-bank.json',
            'apps-script/dasha/next-bank.json',
            'apps-script/dasha/review-bank.json',
            'apps-script/dasha/vocabulary-31-40.json')]
          assert all(d['student']=='Даша' and len(d['levels'])==10 for d in data)
          all_levels=sum((d['levels'] for d in data),[])
          assert len(all_levels)==40
          assert all(len(level)==(10 if i<30 else 15) for i,level in enumerate(all_levels))
          assert len({q[0] for level in all_levels for q in level})==450
          for level in all_levels:
            for prompt,opts,correct,explanation in level:
              assert len(opts)==3 and len(set(opts))==3
              assert type(correct)==int and correct in (0,1,2) and explanation
          print('PASS: 30 original sets preserved; 10 new levels with 15 questions each; 50 basic nouns.')
          PY
      - name: Install clasp
        run: npm install --global @google/clasp
      - name: Verify previous live bank, patch, test, publish existing Dasha deployment
        env:
          CLASP_CREDENTIALS_JSON: ${{ secrets.CLASP_CREDENTIALS_JSON }}
          SCRIPT_ID: 18qsGmeecVOv6LzvPfLBjZfYGAJdiKgUksYJGyjdFVsrLWBu2cNN16Fpq
          DEPLOYMENT_ID: AKfycbzjiijPpMKBoR4FAU4rny_niASspsCXHqIN4bygEcLHNDopmyyr_aH6QPZkLEPWpHTmDw
        run: |
          set -euo pipefail
          test -n "$CLASP_CREDENTIALS_JSON"
          printf '%s' "$CLASP_CREDENTIALS_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          trap 'rm -f "$HOME/.clasprc.json"' EXIT
          stage="$RUNNER_TEMP/dasha-review-stage"
          mkdir -p "$stage"
          printf '{"scriptId":"%s"}\n' "$SCRIPT_ID" > "$stage/.clasp.json"
          (
            cd "$stage"
            clasp pull
            clasp list-deployments > "$RUNNER_TEMP/dasha-deployments-before.txt"
          )
          grep -Fq "$DEPLOYMENT_ID" "$RUNNER_TEMP/dasha-deployments-before.txt"
          test -s "$stage/Код.js"
          test -s "$stage/appsscript.json"
          python3 -m json.tool "$stage/appsscript.json" >/dev/null
          python3 apps-script/dasha/extend-vocabulary-bank.py "$stage/Код.js" \
            apps-script/dasha/beginner-bank.json \
            apps-script/dasha/next-bank.json \
            apps-script/dasha/review-bank.json \
            apps-script/dasha/vocabulary-31-40.json
          node --check "$stage/Код.js"

          DASHA_CODE_PATH="$stage/Код.js" node - <<'JS'
          'use strict';
          const fs=require('node:fs'),vm=require('node:vm');
          const src=fs.readFileSync(process.env.DASHA_CODE_PATH,'utf8');
          const values=new Map([['DASHA_CURRENT_LEVEL','30'],['DASHA_REWARD_EPOCH','test-epoch']]);
          const p={getProperty:k=>values.has(k)?values.get(k):null,setProperty:(k,v)=>values.set(k,String(v))};
          const old=[new Date('2026-11-26T10:00:00Z'),'Даша',30,'Уровень 30',10,10,60,'old-perfect-30',
            JSON.stringify({verified:true,answers:[]}),60,'test-epoch'];
          const rows=[old];
          const sheet={
            getLastRow:()=>rows.length+1,
            getRange:(row,col,count,width)=>({
              getValues:()=>rows.slice(row-2,row-2+count).map(r=>r.slice(col-1,col-1+width))
            }),
            appendRow:row=>rows.push(row)
          };
          const ctx={
            PropertiesService:{getScriptProperties:()=>p},
            LockService:{getScriptLock:()=>({waitLock:()=>{},releaseLock:()=>{}})},
            Utilities:{getUuid:()=>'test-epoch'},
            console:{error:()=>{}}
          };
          vm.createContext(ctx);
          vm.runInContext(src,ctx,{timeout:4000});
          ctx.sheet=sheet;
          vm.runInContext('dashaSheet_=function(){return sheet;};'+
            'readDashaRewardJournal_=function(){return [];};'+
            'dashaTelegram_=function(){};',ctx,{timeout:4000});
          const meta=vm.runInContext('({total:DASHA_LEVELS,bank:DASHA_BANK,level:dashaLevel_()})',ctx);
          if(meta.total!==40||meta.bank.length!==40||
             meta.bank[29].length!==10||meta.bank[30].length!==15||
             meta.level!==31||values.get('DASHA_CURRENT_LEVEL')!=='31')
            throw Error('Verified old 10/10 at level30 must open level31 with 15 questions.');
          const initial=vm.runInContext('dashaStatus_(sheet)',ctx);
          if(initial.earned!==60||initial.spent!==0||initial.balance!==60)
            throw Error('Existing 60-point awards must be preserved.');
          const correct=vm.runInContext('DASHA_BANK[30].map((q,i)=>({questionId:"q"+(i+1),selectedIndex:q[2]}))',ctx);
          const wrong=correct.map((a,i)=>({questionId:a.questionId,
            selectedIndex:i===0?(a.selectedIndex+1)%3:a.selectedIndex}));
          ctx.payload={level:31,attemptId:'dasha-vocab-bad-1',answers:wrong,durationSeconds:100};
          const failed=vm.runInContext('dashaSubmit_(payload)',ctx);
          if(failed.score!==14||failed.total!==15||failed.pointsAwarded!==0||
             failed.pointsPenalty!==30||failed.pointsBalance!==30||
             failed.passed||values.get('DASHA_CURRENT_LEVEL')!=='31')
            throw Error('14/15 should lose 30 without unlocking level32.');
          const repeat=vm.runInContext('dashaSubmit_(payload)',ctx);
          if(!repeat.duplicate||repeat.total!==15||repeat.pointsPenalty!==30||rows.length!==2)
            throw Error('Duplicate attempt must never debit 30 twice.');
          ctx.payload={level:31,attemptId:'dasha-vocab-good-2',answers:correct,durationSeconds:100};
          const perfect=vm.runInContext('dashaSubmit_(payload)',ctx);
          if(perfect.score!==15||perfect.total!==15||!perfect.passed||
             perfect.pointsAwarded!==60||perfect.pointsPenalty!==0||
             perfect.pointsBalance!==90||values.get('DASHA_CURRENT_LEVEL')!=='32')
            throw Error('15/15 should award 60 and unlock level32.');
          const final=vm.runInContext('dashaStatus_(sheet)',ctx);
          if(final.earned!==120||final.spent!==30||final.balance!==90)
            throw Error('Historical scores and new rewards did not reconcile.');
          // No completion row means no level31 unlock.
          const oldScore=rows[0][4];
          rows[0][4]=9;
          values.set('DASHA_CURRENT_LEVEL','30');
          if(vm.runInContext('dashaLevel_()',ctx)!==30)throw Error('9/10 must NOT unlock 31.');
          rows[0][4]=oldScore;
          if(vm.runInContext('dashaLevel_()',ctx)!==31)throw Error('Saved 10/10 must unlock 31.');
          console.log('PASS: 31/40 after verified 30/30; 14/15=-30 once; 15/15=+60; historical points unchanged.');
          JS
          python3 - "$stage" <<'PY'
          from pathlib import Path
          import sys
          found={p.name for p in Path(sys.argv[1]).iterdir() if p.is_file()}
          assert found=={'.clasp.json','Код.js','appsscript.json'},found
          print('PASS: only original Google project files staged.')
          PY
          if ! clasp create-deployment --help >/dev/null 2>&1; then
            echo "::error::Supported safe deployment command missing. Aborting."
            exit 1
          fi
          (
            cd "$stage"
            clasp push --force
            clasp create-deployment --deploymentId "$DEPLOYMENT_ID" --description "Dasha 31-40 bilingual words with Russian pronunciation"
            clasp list-deployments > "$RUNNER_TEMP/dasha-deployments-after.txt"
          )
          grep -Fq "$DEPLOYMENT_ID" "$RUNNER_TEMP/dasha-deployments-after.txt"
          echo "Published Dasha vocabulary 31-40 on original URL without modifying historic results."
      - name: Verify live 15-question level 31-40 and reward history
        run: |
          python3 - <<'PY'
          import json,urllib.parse,urllib.request
          from pathlib import Path
          url='https://script.google.com/macros/s/AKfycbzjiijPpMKBoR4FAU4rny_niASspsCXHqIN4bygEcLHNDopmyyr_aH6QPZkLEPWpHTmDw/exec'
          def get(action):
            params=urllib.parse.urlencode({'action':action,'callback':'verifyDasha'})
            req=urllib.request.Request(url+'?'+params,headers={'User-Agent':'DashaReviewReleaseCheck/1.0'})
            with urllib.request.urlopen(req,timeout=45) as response: text=response.read(300000).decode()
            assert text.startswith('verifyDasha(') and text.rstrip().endswith(');')
            data=json.loads(text[len('verifyDasha('):text.rfind(');')])
            if not data.get('ok'):raise RuntimeError(str(data.get('error')))
            return data
          active=get('getTest')
          level=int(active['level'])
          assert int(active['totalLevels'])==40,active['totalLevels']
          assert 31<=level<=40,('Expected verified old level 30 to unlock the new block',level)
          expected=json.loads(Path('apps-script/dasha/vocabulary-31-40.json').read_text())['levels'][level-31]
          actual=active['questions']
          assert len(actual)==len(expected)==15
          for i,(question,source) in enumerate(zip(actual,expected),1):
            assert question['id']=='q'+str(i),('id',i)
            assert question['prompt']==source[0],('prompt',i)
            assert question['options']==source[1],('options',i)
            assert 'correctIndex' not in question and 'explanation' not in question
          reward=get('getRewards')
          assert isinstance(reward.get('pointsBalance'),(int,float))
          assert isinstance(reward.get('history'),list)
          assert active.get('rewardPerLevel')==60
          print('PASS: live Dasha set '+str(level)+'/40; 15 new questions, +60, -30 and reward history verified.')
          PY
