name: Artyom Apps Script - publish approved release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PUBLISH_ARTYOM to update the existing web app deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: artyom-apps-script-publication
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.confirmation == 'PUBLISH_ARTYOM' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check GitHub code
        run: |
          set -euo pipefail
          node --check apps-script/artyom/Code.js
          test -s apps-script/artyom/Dashboard.html
      - name: Install clasp
        run: npm install --global @google/clasp
      - name: Verify deployment, stage, and publish approved code
        env:
          CLASP_CREDENTIALS_JSON: ${{ secrets.CLASP_CREDENTIALS_JSON }}
          SCRIPT_ID: 1RM7ynJPf5CTAHGLjV9Ciud7wFswr8V7B77udf2O0grgwvk070fq9UtRH
          DEPLOYMENT_ID: AKfycby7h-mc--QERnZ_N62qBu2FbjmvOHRYYzFAMH0ziH3w1w3uVgPUM2_EVX2EEw4zzc7VPw
        run: |
          set -euo pipefail
          test -n "$CLASP_CREDENTIALS_JSON"
          printf '%s' "$CLASP_CREDENTIALS_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          trap 'rm -f "$HOME/.clasprc.json"' EXIT
          stage="$RUNNER_TEMP/artyom-release-stage"
          mkdir -p "$stage"
          printf '{"scriptId":"%s"}\n' "$SCRIPT_ID" > "$stage/.clasp.json"
          (
            cd "$stage"
            clasp pull
            clasp deployments > "$RUNNER_TEMP/artyom-deployments-before.txt"
          )
          grep -Fq "$DEPLOYMENT_ID" "$RUNNER_TEMP/artyom-deployments-before.txt"
          test -s "$stage/Код.js"
          test -s "$stage/Dashboard.html"
          test -s "$stage/appsscript.json"
          python3 -m json.tool "$stage/appsscript.json" > /dev/null
          # Abort if Google HEAD changed since the GitHub baseline.
          # Allow only one trailing whitespace byte (the observed Google serialization difference).
          # Historical source requires full checkout history; verify it before staging.
          BASELINE_COMMIT=f1281456bbfb52a585a68182555cb79b83f4151d
          git cat-file -e "$BASELINE_COMMIT:apps-script/artyom/Code.js"
          git cat-file -e "$BASELINE_COMMIT:apps-script/artyom/Dashboard.html"
          git show "$BASELINE_COMMIT:apps-script/artyom/Code.js" > "$RUNNER_TEMP/artyom-baseline-code.js"
          git show "$BASELINE_COMMIT:apps-script/artyom/Dashboard.html" > "$RUNNER_TEMP/artyom-baseline-dashboard.html"
          python3 - "$stage" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          expected=(Path(__import__("os").environ["RUNNER_TEMP"])/"artyom-baseline-code.js").read_bytes()
          actual=(root/"Код.js").read_bytes()
          code_ok=(actual==expected or
                   (len(actual)==len(expected)+1 and actual.startswith(expected)
                    and actual[-1] in (9,10,13,32)))
          html_ok=((root/"Dashboard.html").read_bytes() ==
                   (Path(__import__("os").environ["RUNNER_TEMP"])/"artyom-baseline-dashboard.html").read_bytes())
          if not code_ok or not html_ok:
              print("::error::Google HEAD has diverged from GitHub baseline. Manual reconciliation required; no push.")
              sys.exit(1)
          print("Live source baseline verified before any write.")
          PY
          cp apps-script/artyom/Code.js "$stage/Код.js"
          cp apps-script/artyom/Dashboard.html "$stage/Dashboard.html"
          test ! -e "$stage/Code.js"
          node --check "$stage/Код.js"
          python3 - "$stage" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          expected={".clasp.json","Код.js","Dashboard.html","appsscript.json"}
          if {p.name for p in root.iterdir() if p.is_file()} != expected:
              sys.exit("Unexpected files in release stage; aborting.")
          print("Staging validated. Existing deployment will be updated in place.")
          PY
          # Check the supported deployment command before making any remote writes.
          if clasp create-deployment --help > /dev/null 2>&1; then
            deploy_command=create-deployment
          elif clasp deploy --help > /dev/null 2>&1; then
            deploy_command=deploy
          else
            echo "::error::No supported clasp deploy command found; refusing to push"
            exit 1
          fi
          (
            cd "$stage"
            clasp push --force
            clasp "$deploy_command" --deploymentId "$DEPLOYMENT_ID" --description "Artyom release from GitHub commit $GITHUB_SHA"
            clasp deployments > "$RUNNER_TEMP/artyom-deployments-after.txt"
          )
          grep -Fq "$DEPLOYMENT_ID" "$RUNNER_TEMP/artyom-deployments-after.txt"
          echo "Existing deployment updated; web app URL remains tied to deployment ID."
