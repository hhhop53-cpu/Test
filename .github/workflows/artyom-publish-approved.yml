name: Artyom Apps Script - publish approved release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PUBLISH_ARTYOM to update the existing web app deployment'
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - 'release-requests/artyom-release.json'

permissions:
  contents: read

concurrency:
  group: artyom-apps-script-publication
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'PUBLISH_ARTYOM') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check GitHub code and approved release request
        run: |
          set -euo pipefail
          node --check apps-script/artyom/Code.js
          node .github/scripts/validate-artyom-banks.cjs
          node .github/scripts/test-artyom-retries.cjs
          test -s apps-script/artyom/Dashboard.html
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            python3 - <<'PY'
          from pathlib import Path
          import json, subprocess, sys
          data = json.loads(Path('release-requests/artyom-release.json').read_text())
          if data.get('action') != 'publish_artyom':
              sys.exit('Invalid release request action.')
          for field, file in [('code_blob_sha', 'apps-script/artyom/Code.js'),
                              ('dashboard_blob_sha', 'apps-script/artyom/Dashboard.html')]:
              expected = data.get(field)
              actual = subprocess.check_output(['git','hash-object',file], text=True).strip()
              if expected != actual:
                  sys.exit(f'Unexpected {file} content; refusing to publish.')
          print('Approved release request matches source blobs.')
          PY
          fi
      - name: Install clasp
        run: npm install --global @google/clasp
      - name: Verify deployment, stage, and publish approved code
        env:
          CLASP_CREDENTIALS_JSON: ${{ secrets.CLASP_CREDENTIALS_JSON }}
          SCRIPT_ID: 1RM7ynJPf5CTAHGLjV9Ciud7wFswr8V7B77udf2O0grgwvk070fq9UtRH
          DEPLOYMENT_ID: AKfycby7h-mc--QERnZ_N62qBu2FbjmvOHRYYzFAMH0ziH3w1w3uVgPUM2_EVX2EEw4zzc7VPw
        run: |
          set -euo pipefail
          test -n "$CLASP_CREDENTIALS_JSON"
          printf '%s' "$CLASP_CREDENTIALS_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          trap 'rm -f "$HOME/.clasprc.json"' EXIT
          stage="$RUNNER_TEMP/artyom-release-stage"
          mkdir -p "$stage"
          printf '{"scriptId":"%s"}\n' "$SCRIPT_ID" > "$stage/.clasp.json"
          (
            cd "$stage"
            clasp pull
            clasp deployments > "$RUNNER_TEMP/artyom-deployments-before.txt"
          )
          grep -Fq "$DEPLOYMENT_ID" "$RUNNER_TEMP/artyom-deployments-before.txt"
          test -s "$stage/Код.js"
          test -s "$stage/Dashboard.html"
          test -s "$stage/appsscript.json"
          python3 -m json.tool "$stage/appsscript.json" > /dev/null
          # Abort if Google HEAD differs from the last approved live release (v24).
          # These immutable blobs were pinned in the previous approved release request,
          # and verified when version 24 was deployed successfully.
          # Allow one Google serialization whitespace byte, no other differences.
          BASELINE_CODE_BLOB=5323d1d649c63d9c6e35db2f8e84d663287a9296
          BASELINE_DASHBOARD_BLOB=74ce21a3c57f2c06c3083c7b470b5afb51b6ae7e
          git cat-file -e "$BASELINE_CODE_BLOB"
          git cat-file -e "$BASELINE_DASHBOARD_BLOB"
          git cat-file blob "$BASELINE_CODE_BLOB" > "$RUNNER_TEMP/artyom-baseline-code.js"
          git cat-file blob "$BASELINE_DASHBOARD_BLOB" > "$RUNNER_TEMP/artyom-baseline-dashboard.html"
          python3 - "$stage" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          expected=(Path(__import__("os").environ["RUNNER_TEMP"])/"artyom-baseline-code.js").read_bytes()
          actual=(root/"Код.js").read_bytes()
          code_ok=(actual==expected or
                   (len(actual)==len(expected)+1 and actual.startswith(expected)
                    and actual[-1] in (9,10,13,32)))
          html_ok=((root/"Dashboard.html").read_bytes() ==
                   (Path(__import__("os").environ["RUNNER_TEMP"])/"artyom-baseline-dashboard.html").read_bytes())
          if not code_ok or not html_ok:
              print("::error::Google HEAD has diverged from GitHub baseline. Manual reconciliation required; no push.")
              sys.exit(1)
          print("Live source baseline verified before any write.")
          PY
          cp apps-script/artyom/Code.js "$stage/Код.js"
          cp apps-script/artyom/Dashboard.html "$stage/Dashboard.html"
          test ! -e "$stage/Code.js"
          node --check "$stage/Код.js"
          python3 - "$stage" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          expected={".clasp.json","Код.js","Dashboard.html","appsscript.json"}
          if {p.name for p in root.iterdir() if p.is_file()} != expected:
              sys.exit("Unexpected files in release stage; aborting.")
          print("Staging validated. Existing deployment will be updated in place.")
          PY
          # Check the supported deployment command before making any remote writes.
          if ! clasp create-deployment --help > /dev/null 2>&1; then
            echo "::error::clasp create-deployment is unavailable; refusing to push"
            exit 1
          fi
          (
            cd "$stage"
            clasp push --force
            clasp create-deployment --deploymentId "$DEPLOYMENT_ID" --description "Artyom release from GitHub commit $GITHUB_SHA"
            clasp deployments > "$RUNNER_TEMP/artyom-deployments-after.txt"
          )
          grep -Fq "$DEPLOYMENT_ID" "$RUNNER_TEMP/artyom-deployments-after.txt"
          echo "Existing deployment updated; web app URL remains tied to deployment ID."
      - name: Read-only verification of published active set
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          url = 'https://script.google.com/macros/s/AKfycby7h-mc--QERnZ_N62qBu2FbjmvOHRYYzFAMH0ziH3w1w3uVgPUM2_EVX2EEw4zzc7VPw/exec'
          params = urllib.parse.urlencode({'action': 'getTest', 'callback': 'verifyTest'})
          with urllib.request.urlopen(urllib.request.Request(url + '?' + params,
                   headers={'User-Agent':'ArtyomReleaseVerify/1.0'}),timeout=45) as r:
              body = r.read(500000).decode('utf-8')
          if not (body.startswith('verifyTest(') and body.rstrip().endswith(');')):
              raise RuntimeError('Live API did not return a JSONP payload.')
          data = json.loads(body[len('verifyTest('):body.rfind(');')])
          if not data.get('ok'):
              raise RuntimeError('Live API reported: ' + str(data.get('error','unknown')))
          qs = data.get('questions',[])
          if len(qs) != 25 or len({q.get('prompt') for q in qs}) != len(qs) or len({q.get('id') for q in qs}) != len(qs):
              raise RuntimeError('Invalid/duplicate questions in live server.')
          if any('correctIndex' in q or 'explanation' in q for q in qs):
              raise RuntimeError('Answer key exposed in live API.')
          if len([q for q in qs if q.get('type','').startswith('Word formation · ')])!=5:
              raise RuntimeError('Expected five new word formation questions.')
          if len([q for q in qs if q.get('type','').startswith('Phrasal verbs')])!=4:
              raise RuntimeError('Expected the four earlier phrasal verb questions.')
          if int(data.get('rewardPerSet',0))!=80:
              raise RuntimeError('New perfect-set reward should be +80.')
          if not str(data.get('testId','')).startswith('morphology-25-v1-'):
              raise RuntimeError('The published API returned an old 20-question bank.')
          print('Live smoke passed: set %s of %s, %s questions.' % (data.get('setNumber'),data.get('totalSets'),len(qs)))
          PY
