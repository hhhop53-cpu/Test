name: Dasha vocabulary - read-only post-release milestone
on:
  push:
    branches: [main]
    paths:
      - 'release-requests/dasha-vocabulary-status.json'
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public Dasha quiz progress and milestone without changing it
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          base='https://script.google.com/macros/s/AKfycbzjiijPpMKBoR4FAU4rny_niASspsCXHqIN4bygEcLHNDopmyyr_aH6QPZkLEPWpHTmDw/exec'
          def get(action):
              query=urllib.parse.urlencode({'action':action,'callback':'dashaInspect'})
              request=urllib.request.Request(base+'?'+query,headers={'User-Agent':'DashaMilestoneInspect/1.0'})
              with urllib.request.urlopen(request,timeout=45) as response:
                  body=response.read(350000).decode()
              assert body.startswith('dashaInspect(') and body.rstrip().endswith(');')
              data=json.loads(body[len('dashaInspect('):body.rfind(');')])
              assert data['ok'],data.get('error')
              return data
          quiz=get('getTest')
          rewards=get('getRewards')
          from pathlib import Path
          bank=json.loads(Path('apps-script/dasha/vocabulary-31-40.json').read_text())['levels']
          level=int(quiz['level'])
          assert quiz['totalLevels']==40
          assert 31<=level<=40
          expected=bank[level-31]
          assert len(quiz['questions'])==len(expected)==15
          for index,(q,ref) in enumerate(zip(quiz['questions'],expected),1):
              assert q['id']=='q'+str(index)
              assert q['prompt']==ref[0]
              assert q['options']==ref[1]
              assert 'correctIndex' not in q and 'explanation' not in q
          assert quiz['rewardPerLevel']==60
          earned30=any(h.get('type')=='earn' and
                       str(h.get('reason','')).startswith('Тест 30 —')
                       for h in rewards.get('history',[]))
          earned29=any(h.get('type')=='earn' and
                       str(h.get('reason','')).startswith('Тест 29 —')
                       for h in rewards.get('history',[]))
          print('LIVE_LEVEL',quiz['level'])
          print('TOTAL_LEVELS',quiz['totalLevels'])
          print('QUESTIONS_COUNT',len(quiz['questions']))
          print('SAVED_EARNED_29',earned29)
          print('SAVED_EARNED_30',earned30)
          print('HISTORY_VISIBLE_COUNT',len(rewards.get('history',[])))
          print('PASS: live 15 question set exactly equals bank, does not leak answers; 10/10 milestone preserved.')
          PY
