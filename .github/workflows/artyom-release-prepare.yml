name: Artyom Apps Script - prepare release (NO DEPLOY)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artyom-apps-script-publication
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GitHub sources
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate sources
        run: |
          set -euo pipefail
          node --check apps-script/artyom/Code.js
          test -s apps-script/artyom/Dashboard.html
      - name: Install clasp
        run: npm install --global @google/clasp
      - name: Build isolated staging directory from live project
        env:
          CLASP_CREDENTIALS_JSON: ${{ secrets.CLASP_CREDENTIALS_JSON }}
          SCRIPT_ID: 1RM7ynJPf5CTAHGLjV9Ciud7wFswr8V7B77udf2O0grgwvk070fq9UtRH
          DEPLOYMENT_ID: AKfycby7h-mc--QERnZ_N62qBu2FbjmvOHRYYzFAMH0ziH3w1w3uVgPUM2_EVX2EEw4zzc7VPw
        run: |
          set -euo pipefail
          test -n "$CLASP_CREDENTIALS_JSON"
          printf '%s' "$CLASP_CREDENTIALS_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          trap 'rm -f "$HOME/.clasprc.json"' EXIT
          stage="$RUNNER_TEMP/artyom-release-stage"
          mkdir -p "$stage"
          printf '{"scriptId":"%s"}\n' "$SCRIPT_ID" > "$stage/.clasp.json"
          (
            cd "$stage"
            clasp pull
            clasp deployments > "$RUNNER_TEMP/artyom-deployments.txt"
          )
          grep -Fq "$DEPLOYMENT_ID" "$RUNNER_TEMP/artyom-deployments.txt"
          test -s "$stage/Код.js"
          test -s "$stage/Dashboard.html"
          test -s "$stage/appsscript.json"
          python3 -m json.tool "$stage/appsscript.json" > /dev/null
          cp apps-script/artyom/Code.js "$stage/Код.js"
          cp apps-script/artyom/Dashboard.html "$stage/Dashboard.html"
          test ! -e "$stage/Code.js"
          node --check "$stage/Код.js"
          python3 - "$stage" <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1])
          expected={"Код.js","Dashboard.html","appsscript.json",".clasp.json"}
          actual={p.name for p in root.iterdir() if p.is_file()}
          if actual != expected:
              print("::error::Unexpected staging files: "+repr(sorted(actual ^ expected)))
              sys.exit(1)
          print("Staging validated: original Google manifest and Cyrillic filename preserved.")
          print("No source contents or credentials exported.")
          PY
          echo "Release preparation passed. NO clasp push, version, or deploy performed."
